      properties:
        matched:
          type: boolean
        decodedIdHex:
          type: string
          nullable: true
        expectedIdHex:
          type: string
          nullable: true
        rule:
          type: string
      required: [matched, decodedIdHex, expectedIdHex, rule]

    DnaCandidateConfidenceContributors:
      type: object
      description: Her bir 0..1 alan aday skora katki verir; conflictPenalty negatif ceza.
      properties:
        dnaSimilarity:
          type: number
          format: float
        sealMapMatch:
          type: number
          format: float
        layerSignals:
          type: number
          format: float
        structuralFingerprint:
          type: number
          format: float
        recoveryHints:
          type: number
          format: float
        crossModuleConsistency:
          type: number
          format: float
        conflictPenalty:
          type: number
          format: float

    DnaCandidateConfidence:
      type: object
      description: ADAY skor. ID okunamazsa/uyusmazsa DNA izlerinden 0..1 yuzdeli guven. Bu skor KESIN KARAR DEGILDIR (neverFinal true). Mahkemelik kesin karar yalniz DnaConfirmedDecision uzerinden verilir.
      properties:
        score:
          type: number
          format: float
        tier:
          type: string
          enum: [none, weak, medium, strong]
        contributors:
          $ref: "#/components/schemas/DnaCandidateConfidenceContributors"
        neverFinal:
          type: boolean
        authority:
          type: string
        notes:
          type: string
      required: [score, tier, contributors, neverFinal, authority]

