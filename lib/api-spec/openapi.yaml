          $ref: "#/components/schemas/ProtectionLayerSummary"
        botDetection:
          $ref: "#/components/schemas/BotDetectionResult"
        honeytokens:
          type: object
          description: |
            Present only when bot-trap layer fired (verdict == "bot"). Token
            details (`fakeValue`, `position`) are intentionally NOT returned
            in this response — only the count, broken down by kind. Full
            per-token records are admin-only via `GET /bot-traps`.
