            injected: { type: integer }
            byKind:
              type: object
              additionalProperties: { type: integer }
            density: { type: number, description: "Effective adaptive density used (0..1)." }
          required: [injected]
      required: [protectedText, variantHash, replacementCount, replacements]

    AnalyzeTextRequest:
      type: object
      properties:
        text: { type: string }
        candidateClientIds:
          type: array
          items:
            oneOf: [{ type: string }, { type: integer }]
        minMatches: { type: integer, minimum: 1 }
        scanHoneytokens: { type: boolean, default: true }
      required: [text]

    ChannelScore:
      type: object
      properties:
        matched: { type: integer }
        total: { type: integer }
        score: { type: number }
        present: { type: boolean }
      required: [matched, total, score]

    ChannelBreakdown:
      type: object
      properties:
        synonym: { $ref: "#/components/schemas/ChannelScore" }
        homoglyph: { $ref: "#/components/schemas/ChannelScore" }
        zeroWidth: { $ref: "#/components/schemas/ChannelScore" }
      required: [synonym, homoglyph, zeroWidth]

    CandidateMatch:
      type: object
      properties:
        clientId: { type: string }
        matchedTokens: { type: integer }
        totalTokens: { type: integer }
        confidenceScore: { type: number }
        combinedScore: { type: number }
        channels: { $ref: "#/components/schemas/ChannelBreakdown" }
      required: [clientId, matchedTokens, totalTokens, confidenceScore]

    GenerateReportRequest:
      type: object
      properties:
        suspectText: { type: string }
        protectedText: { type: string }
        suspectedClientId:
          oneOf: [{ type: integer }, { type: string }, { type: "null" }]
        confidenceScore: { type: number }
        matchedTokens: { type: integer }
        totalTokens: { type: integer }
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/CandidateMatch"
        channelBreakdown:
          $ref: "#/components/schemas/ChannelBreakdown"
        stylometry:
          $ref: "#/components/schemas/StylometricMetrics"
        diffSummary:
          $ref: "#/components/schemas/DiffSummary"
        spatialVariance:
          $ref: "#/components/schemas/SpatialVarianceReport"
        expertNotes: { type: string, maxLength: 8000 }
        userId: { type: string }
        absoluteBreach:
          type: boolean
          description: |
            True when analyze-text returned a single-client honeytoken hit.
            Drives the PDF's top-line verdict to "Güçlü teknik eşleşme".
        multiSuspect:
          type: boolean
          description: |
            True when ≥2 clients have decisive trap evidence in the same
            suspect text. Drives the PDF's top-line verdict to "Birden
            fazla kaynak izi — kesin tek kaynak yok".
        suspectedClients:
          type: array
          description: |
            All clients with decisive trap evidence (mirrors analyze-text's
            response). Required when multiSuspect=true to render the list.
          items:
            type: object
            properties:
              clientId: { type: string }
              confidenceScore: { type: number }
            required: [clientId, confidenceScore]
      required: [suspectText, protectedText, confidenceScore, matchedTokens, totalTokens]

    AnalyzeTextResponse:
      type: object
      properties:
        suspectedClientId:
          oneOf: [{ type: string }, { type: "null" }]
        confidenceScore: { type: number }
        combinedScore: { type: number }
        matchedTokens: { type: integer }
        totalTokens: { type: integer }
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/CandidateMatch"
        channelBreakdown:
          oneOf:
            - $ref: "#/components/schemas/ChannelBreakdown"
            - { type: "null" }
        stylometry:
          $ref: "#/components/schemas/StylometricMetrics"
        absoluteBreach: { type: boolean }
        breachEvidence:
          type: object
          description: Present only on a honeytoken hit — confidence is forced to 1.0.
          properties:
            kind: { type: string }
            fakeValue: { type: string }
            matchedClientId: { type: string }
            honeytokenId: { type: integer }
            keyVersion: { type: string }
            servedAt: { type: string, format: date-time }
            position: { type: integer }
          required: [kind, fakeValue, matchedClientId, honeytokenId, servedAt, position]
        multiSuspect:
          type: boolean
          description: True when ≥2 distinct clients have decisive trap evidence in the same suspect text. Each entry in `suspectedClients` is independently confirmed.
        suspectedClients:
          type: array
          description: All clients with decisive trap evidence, sorted by evidence count.
          items:
            type: object
            properties:
              clientId: { type: string }
              confidenceScore: { type: number }
              evidenceCount: { type: integer }
              patternHits: { type: integer }
              jitterHits: { type: integer }
              kinds:
                type: array
                items: { type: string }
            required: [clientId, confidenceScore, evidenceCount, patternHits, jitterHits, kinds]
        warning:
          type: string
          description: Human-readable note attached when `multiSuspect=true`.
        cascadeIntegrity:
          $ref: "#/components/schemas/CascadeIntegrityReport"
        channelIntegrityProfile:
          type: array
          description: |
            Faz 3 — best aday için per-channel tier sınıflandırması (T0/T1/T2/AUX).
            Yardımcı analiz; legacy `suspectedClientId/absoluteBreach/multiSuspect`
            kararlarına girmez. Honeytoken yolunda T0 kanalı `score=1` döner.
          items:
            $ref: "#/components/schemas/ChannelProfileEntry"
        tieredVerdict:
          $ref: "#/components/schemas/TieredVerdictBlock"
        semanticPositionalVerification:
          $ref: "#/components/schemas/SemanticVerificationResult"
        vaultVerification:
          $ref: "#/components/schemas/VaultVerificationResult"
        primarySuspect:
          $ref: "#/components/schemas/PrimarySuspect"
        forensicParaphraseWarning:
          type: boolean
          description: |
            Faz 4 — best aday için signalScore ≥ 0.70 ve lexicalOverlap ≤ 0.50
            ise true. Anlamsal mühür hayatta ama yüzeysel kelimeler büyük
            ölçüde değişmiş → sadık paraphrase saldırısı sinyali. Yardımcı
            uyarıdır; legacy attribution ladder'ını ezmez.
      required: [suspectedClientId, confidenceScore, matchedTokens, totalTokens, candidates]

    VaultVerificationResult:
      type: object
      description: |
        v4.1 Step 3 Bölüm 2 — Vault PQC verify roundtrip raporu. Yalnızca
        `status="vault-confirmed"` durumunda `primarySuspect.matchConfidence`
        `"preliminary" → "vault-confirmed"` (kriptografik kesinlik) seviyesine
        yükseltilir. Tampering veya not-found durumunda `"preliminary"` kalır.
      properties:
        status:
          type: string
          enum: [vault-confirmed, signature-mismatch, not-found]
        algorithm: { type: string, description: "ml-dsa-65" }
        keyDerivation: { type: string, description: "hkdf-v1" }
        payloadDigestSha256: { type: string }
        signedAt: { type: string, format: date-time }
        version: { type: integer }
        docId: { type: string }
      required: [status]

    PrimarySuspect:
      type: object
      description: |
        v4.1 Step 2.5 + Step 3 Bölüm 2 — birincil şüpheli özet kararı.
        `matchConfidence` default `"preliminary"` (ön bulgu); vault verify
        roundtrip'i başarılıysa `"vault-confirmed"`a yükseltilir.
      properties:
        source:
          type: string
          enum: [multi-channel, decoy, none]
        clientId:
          oneOf: [{ type: string }, { type: "null" }]
        decoyViewerId: { type: string }
        matchConfidence:
          type: string
          enum: [preliminary, vault-confirmed]
      required: [source, clientId, matchConfidence]

    SemanticVerificationResult:
      type: object
      description: |
        Faz 4 — Semantic Positional Watermarking verify raporu (best aday).
        Yardımcı kanıttır; T2 corroborator olarak kanal profiline iliştirilir
        ama tek başına STRONG karar veremez (R2 sadece linguisticDna'yı T2
        olarak değerlendirir).
      properties:
        clientId: { type: string }
        docId: { type: string }
        cloakId: { type: string }
        signalScore:
          type: number
          minimum: 0
          maximum: 1
          description: 1 - p_value (Binomial test, p=0.5).
        matchedBits: { type: integer, minimum: 0 }
        totalBits: { type: integer, minimum: 0 }
        pValue: { type: number, minimum: 0, maximum: 1 }
        lexicalOverlap:
          type: number
          minimum: 0
          maximum: 1
          description: Per-cümle Jaccard ortalaması (orijinal vs suspect tokens).
        alignedSentences: { type: integer, minimum: 0 }
        forensicParaphraseWarning: { type: boolean }
        verifyTimeMs: { type: number, minimum: 0 }
      required:
        [clientId, docId, cloakId, signalScore, matchedBits, totalBits,
         pValue, lexicalOverlap, alignedSentences,
         forensicParaphraseWarning, verifyTimeMs]

    CascadeIntegrityReport:
      type: object
      description: |
        Faz 2 — Cascade Hash verifier raporu. Yardımcı kanıttır;
        `suspectedClientId`/`absoluteBreach`/`multiSuspect` kararlarını ezmez.
      properties:
        clientId: { type: string }
        docId: { type: string }
        cloakId: { type: string }
        keyDerivation:
          type: string
          enum: [global, "hkdf-v1"]
          description: |
            Persisted chain'in türetilme şeması. `global` legacy Faz 2 ilk
            drop satırlarıdır; `hkdf-v1` v4.0.1 yamasından sonra üretilen
            tenant-türetilmiş anahtar kullanır.
        integrityScore: { type: number, minimum: 0, maximum: 1 }
        brokenAtIndex:
          oneOf: [{ type: integer, minimum: 0 }, { type: "null" }]
        deletedIndices:
          type: array
          items: { type: integer, minimum: 0 }
        modifiedIndices:
          type: array
          items: { type: integer, minimum: 0 }
        reorderedDetected: { type: boolean }
        insertedCount: { type: integer, minimum: 0 }
        totalStored: { type: integer, minimum: 0 }
        totalCandidate: { type: integer, minimum: 0 }
      required:
        [clientId, docId, cloakId, integrityScore, deletedIndices,
         modifiedIndices, reorderedDetected, insertedCount,
         totalStored, totalCandidate]

    ChannelProfileEntry:
      type: object
      description: |
        Faz 3 — Bir tek kanalın tier'ı, normalize skoru (0..1) ve "decay"
        (1 − score). `vital=true` skor VITAL_THRESHOLDS eşiğini aştığında.
      properties:
        name:
          type: string
          enum: [honeytoken, zeroWidth, homoglyph, linguisticDna, semanticPositional, cascadeHash]
        tier:
          type: string
          enum: [T0, T1, T2, AUX]
        score: { type: number, minimum: 0, maximum: 1 }
        decay: { type: number, minimum: 0, maximum: 1 }
        vital: { type: boolean }
        present: { type: boolean }
      required: [name, tier, score, decay, vital, present]

    TieredVerdictCandidateSummary:
      type: object
      properties:
        clientId: { type: string }
        combinedScore: { type: number }
        channelScores:
          type: object
          additionalProperties: { type: number }
        passesStrong: { type: boolean }
      required: [clientId, combinedScore, channelScores, passesStrong]

    TieredVerdictBlock:
      type: object
      description: |
        Faz 3 — Tiered verdict aggregator çıktısı. **Yardımcı katmandır**;
        `FEATURE_DECAY_VERDICT=false` iken `advisoryOnly=true` döner ve
        legacy attribution kararı (suspectedClientId/absoluteBreach/multiSuspect)
        otoriter kalır. `FEATURE_DECAY_VERDICT=true` (default) durumunda da
        legacy alanlar ezilmez — bu blok karar gerekçesini surface eder.
      properties:
        verdict:
          type: string
          enum: [STRONG, AMBIGUOUS, INSUFFICIENT]
        attributedClientIds:
          type: array
          items: { type: string }
        reasons:
          type: array
          items: { type: string }
        marginGuardDemoted: { type: boolean }
        multiSuspectDemoted: { type: boolean }
        margin:
          oneOf: [{ type: number }, { type: "null" }]
        strongCandidateCount: { type: integer, minimum: 0 }
        channelProfile:
          type: array
          items:
            $ref: "#/components/schemas/ChannelProfileEntry"
        candidateSummaries:
          type: array
          items:
            $ref: "#/components/schemas/TieredVerdictCandidateSummary"
        advisoryOnly:
          type: boolean
          description: |
            `true` iken FEATURE_DECAY_VERDICT=false — bu blok yalnızca
            raporlama amaçlıdır, attribution legacy ladder'dan gelir.
        ruleApplied:
          type: string
          description: |
            Verdict'i belirleyen ilk kural (örn. "T0_decisive",
            "T1_double_strong", "T1_T2_combo", "margin_guard_demote",
            "multi_suspect_demote", "ambiguous_floor", "insufficient_floor").
      required:
        [verdict, attributedClientIds, reasons, marginGuardDemoted,
         multiSuspectDemoted, strongCandidateCount, channelProfile,
         candidateSummaries]

    ChannelIntegrityProfileAuditDetails:
      type: object
      description: |
        `ChannelIntegrityProfile_Computed` audit kind'ı için `details` payload.
      properties:
        docId:
          oneOf: [{ type: string }, { type: "null" }]
        suspectedClientId:
          oneOf: [{ type: string }, { type: "null" }]
        verdict:
          type: string
          enum: [STRONG, AMBIGUOUS, INSUFFICIENT]
        ruleApplied: { type: string }
        multiSuspect: { type: boolean }
        marginGap:
          oneOf: [{ type: number }, { type: "null" }]
        profile:
          type: array
          items:
            $ref: "#/components/schemas/ChannelProfileEntry"
        path:
          type: string
          enum: [honeytoken-shortcut, multi-channel]
        featureDecayVerdict: { type: boolean }
      required: [verdict, ruleApplied, multiSuspect, profile, path, featureDecayVerdict]

    BotDetectionResult:
      type: object
      properties:
        verdict:
          type: string
          enum: [human, suspected, bot]
        score: { type: number }
        signals:
          type: array
          items: { type: string }
      required: [verdict, score, signals]

    ProtectHoneytoken:
      type: object
      properties:
        id: { type: integer }
        kind:
          type: string
          enum: [email, phone, amount, percent, date, org, jitter]
        fakeValue: { type: string }
        position: { type: integer }
      required: [id, kind, fakeValue, position]

    BotTrapEvent:
      type: object
      properties:
        id: { type: integer }
        createdAt: { type: string, format: date-time }
        clientId: { type: string }
        keyVersion: { type: string }
        kind: { type: string }
        fakeValue: { type: string }
        sourceIp:
          oneOf: [{ type: string }, { type: "null" }]
        userAgent:
          oneOf: [{ type: string }, { type: "null" }]
        botScore:
          oneOf: [{ type: number }, { type: "null" }]
        botVerdict:
          oneOf: [{ type: string }, { type: "null" }]
        botSignals:
          oneOf: [{ type: string }, { type: "null" }]
        protectionHash:
          oneOf: [{ type: string }, { type: "null" }]
        used: { type: boolean }
        detectedAt:
          oneOf: [{ type: string, format: date-time }, { type: "null" }]
      required: [id, createdAt, clientId, kind, fakeValue, used]

    BotTrapClientBucket:
      type: object
      properties:
        clientId: { type: string }
        served: { type: integer }
        used: { type: integer }
        kinds:
          type: object
          additionalProperties: { type: integer }
      required: [clientId, served, used]

    BotTrapDocumentBucket:
      type: object
      description: Per-carrier-document (per `protectionHash`) trap density. Only documents with ≥1 trap are listed.
      properties:
        protectionHash: { type: string }
        served: { type: integer }
        used: { type: integer }
        clientId: { type: string }
        lastSeenAt: { type: string, format: date-time }
      required: [protectionHash, served, used, clientId, lastSeenAt]

    BotTrapStats:
      type: object
      properties:
        total: { type: integer }
        used: { type: integer }
        byKind:
          type: object
          additionalProperties: { type: integer }
        byVerdict:
          type: object
          additionalProperties: { type: integer }
        byClient:
          type: array
          items:
            $ref: "#/components/schemas/BotTrapClientBucket"
        byDocument:
          type: array
          description: Top recent carrier documents by served trap count.
          items:
            $ref: "#/components/schemas/BotTrapDocumentBucket"
      required: [total, used, byKind, byVerdict, byClient, byDocument]

    StylometricStopWord:
      type: object
      properties:
        word: { type: string }
        count: { type: integer }
      required: [word, count]

    StylometricMetrics:
      type: object
      description: Surface-level style fingerprint (Stylometric_DNA channel).
      properties:
        wordCount: { type: integer }
        uniqueWordCount: { type: integer }
        sentenceCount: { type: integer }
        avgSentenceLength: { type: number }
        lexicalDiversity: { type: number }
        stopWordCount: { type: integer }
        stopWordRatio: { type: number }
        avgWordLength: { type: number }
        stopWordDistribution:
          type: array
          items:
            $ref: "#/components/schemas/StylometricStopWord"
      required:
        - wordCount
        - uniqueWordCount
        - sentenceCount
        - avgSentenceLength
        - lexicalDiversity
        - stopWordCount
        - stopWordRatio
        - avgWordLength
        - stopWordDistribution

    DiffEntry:
      type: object
      properties:
        op:
          type: string
          enum: [equal, add, remove]
        text: { type: string }
      required: [op, text]

    DiffSummary:
      type: object
      properties:
        added: { type: integer }
        removed: { type: integer }
        unchanged: { type: integer }
        similarity: { type: number }
        sample:
          type: array
          items:
            $ref: "#/components/schemas/DiffEntry"
      required: [added, removed, unchanged, similarity]

    SpatialPoint:
      type: object
      properties:
        index: { type: integer }
        col: { type: integer }
        row: { type: integer }
        microX: { type: number }
        microY: { type: number }
        char: { type: string }
        codepoint: { type: string }
        carrier: { type: boolean }
      required: [index, col, row, microX, microY, char, codepoint, carrier]

    SpatialVarianceReport:
      type: object
      properties:
        totalChars: { type: integer }
        wrap: { type: integer }
        carriers: { type: integer }
        microXVariance: { type: number }
        microYVariance: { type: number }
        points:
          type: array
          items:
            $ref: "#/components/schemas/SpatialPoint"
      required: [totalChars, wrap, carriers, microXVariance, microYVariance, points]

    ForensicNote:
      type: object
      properties:
        id: { type: integer }
        createdAt: { type: string, format: date-time }
        suspectedClientId:
          oneOf: [{ type: string }, { type: "null" }]
        confidenceScore:
          oneOf: [{ type: string }, { type: "null" }]
        author:
          oneOf: [{ type: string }, { type: "null" }]
        content: { type: string }
      required: [id, createdAt, content]

    CreateForensicNoteRequest:
      type: object
      properties:
        content: { type: string, minLength: 1, maxLength: 8000 }
        author: { type: string, maxLength: 120 }
        suspectedClientId:
          oneOf:
            - { type: string, minLength: 1, maxLength: 64 }
            - { type: integer, minimum: 0 }
            - { type: "null" }
          description: |
            Müşteri kimliği. String ("client-A", "agency-client-001"),
            numeric legacy ("777" veya 777) veya null kabul edilir.
            Server-side `String(value)` ile string'e normalize edilir.
        confidenceScore: { type: string, maxLength: 32 }
      required: [content]

    AuditEvent:
      type: object
      properties:
        id: { type: integer }
        ts: { type: string, format: date-time }
        ip: { type: string }
        route: { type: string }
        kind: { $ref: "#/components/schemas/AuditKind" }
        clientId:
          oneOf: [{ type: integer }, { type: "null" }]
        userId:
          oneOf: [{ type: string }, { type: "null" }]
        details:
          type: object
          additionalProperties: true
          nullable: true
      required: [id, ts, ip, route, kind]

    AuditStats:
      type: object
      properties:
        total: { type: integer }
        byKind:
          type: object
          additionalProperties:
            type: integer
      required: [total, byKind]

    AuditListResponse:
      type: object
      properties:
        stats:
          $ref: "#/components/schemas/AuditStats"
        events:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
      required: [stats, events]
