  # ---------------------------------------------------------------------------
  # Video Lab (admin-gated) — video L1 anchor MVP.
  # ---------------------------------------------------------------------------
  /aegis/video-lab/encode:
    post:
      operationId: videoLabEncode
      tags: [videoLab]
      summary: Bir video buffer'ına 32-byte ID mührünü gömer (L1 ring, MKV/FFV1)
      description: |
        Admin-gated. `x-admin-token` zorunlu. Multipart `video` (giriş) + `id`
        (32 byte hex) alır. Geri dönüş `application/octet-stream` mühürlenmiş
        video (lossless FFV1 zorunlu — MP4 desteklemez).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                video:
                  type: string
                  description: Binary video content (multipart upload)
                id:
                  type: string
                  description: 32 byte (64 hex char) ID — opsiyonel, verilmezse rastgele UUID kullanılır
                stampCount:
                  type: string
                  description: Mühürlenecek frame sayısı (default "8")
              required: [video]
      responses:
        "200":
          description: Mühürlenmiş video binary (octet-stream — FFV1/MKV)
          content:
            application/octet-stream:
              schema:
                type: string
                description: Binary video stream
        "401":
          $ref: "#/components/responses/Unauthorized"
        "400":
          $ref: "#/components/responses/BadRequest"
  /aegis/video-lab/decode:
    post:
      operationId: videoLabDecode
      tags: [videoLab]
      summary: Bir video'dan L1 mühür payload'ını okur (A1→A5 ladder)
      description: |
        Admin-gated. Multipart `video` + zorunlu `id` (32 byte / 64 hex char).
        Yanıt verdict (`VAULT`/`WEAK_SIGNAL`/`NOT_FOUND`) + per-stage telemetri.

        Karar katmanları: A1 (3 frame) → A2 (8) → A3 (20) → A4 (56) frame
        extraction + A5 (temporal aggregation, A1-A4 vault eşiği geçmezse
        tüm okunan frame byte'ları beklenen ID byte'ına karşı sayılır).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                video:
                  type: string
                  description: Binary video content (multipart upload)
                id:
                  type: string
                  description: 32 byte (64 hex char) veya string ID — bit-exact karşılaştırma için zorunlu
              required: [video, id]
      responses:
        "200":
          description: Decode sonucu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoLabDecodeResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "400":
          $ref: "#/components/responses/BadRequest"

