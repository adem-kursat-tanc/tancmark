openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: aegis
    description: Aegis Data-Shield operations
  - name: audit
    description: Audit log operations
  - name: live-local-management
    description: Tenant-bound single-node Live product-core management. Transport evidence is support-only.
  - name: live-local-playback
    description: Cryptographically authorized same-origin Live and stopped-VOD playback.
  - name: c2pa
    description: Tenant-bound C2PA provenance support. C2PA never grants ownership or opens VAULT.
paths:
  /tancmark/live/local/v1/management-console:
    get:
      operationId: liveLocalManagementConsole
      tags: [live-local-management]
      security: []
      summary: No-data local management shell
      description: The page persists no credentials. Every API request still requires the admin token and a server-verified tenant.
      responses:
        "200": { description: Same-origin HTML management shell, content: { text/html: { schema: { type: string } } } }

  /tancmark/live/local/v1/status:
    get:
      operationId: liveLocalStatus
      tags: [live-local-management]
      security: [{ LiveAdminToken: [], LiveVerifiedTenant: [] }]
      summary: Storage, lease, keyring and measured local-gate status
      responses: { "200": { $ref: "#/components/responses/LiveJson" }, "401": { $ref: "#/components/responses/Unauthorized" }, "503": { $ref: "#/components/responses/LiveError" } }

  /tancmark/live/local/v1/debt:
    get:
      operationId: liveLocalDebt
      tags: [live-local-management]
      security: [{ LiveAdminToken: [], LiveVerifiedTenant: [] }]
      summary: Explicit external, provider and operational debt; no deferred item is reported as complete
      responses: { "200": { $ref: "#/components/responses/LiveJson" }, "401": { $ref: "#/components/responses/Unauthorized" } }

  /tancmark/live/local/v1/console:
    get:
      operationId: liveLocalAuthenticatedConsole
      tags: [live-local-management]
      security: [{ LiveAdminToken: [], LiveVerifiedTenant: [] }]
      summary: Authenticated compatibility redirect to the single functional management shell
      responses: { "303": { description: Redirect, headers: { Location: { schema: { type: string }, description: Same-origin management-console path } } }, "401": { $ref: "#/components/responses/Unauthorized" } }

  /tancmark/live/local/v1/sessions:
    get:
      operationId: liveLocalListSessions
      tags: [live-local-management]
      security: [{ LiveAdminToken: [], LiveVerifiedTenant: [] }]
      summary: Paginated tenant sessions
      parameters: [{ $ref: "#/components/parameters/LiveLimit" }, { $ref: "#/components/parameters/LiveCursor" }]
      responses: { "200": { $ref: "#/components/responses/LiveJson" }, "401": { $ref: "#/components/responses/Unauthorized" } }
    post:
      operationId: liveLocalCreateSession
      tags: [live-local-management]
      security: [{ LiveAdminToken: [], LiveVerifiedTenant: [] }]
      summary: Create a server-owned protected session by default
      description: Body tenant, account, raw ID, registry and signature fields are never identity authority.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LiveCreateSessionRequest" }
            examples: { default: { value: { legalHold: false, protectionMode: PROTECTED_TANCMARK } } }
      responses: { "201": { $ref: "#/components/responses/LiveSessionEnvelope" }, "400": { $ref: "#/components/responses/LiveError" }, "401": { $ref: "#/components/responses/Unauthorized" } }

  /tancmark/live/local/v1/sessions/{sessionId}:
    get:
      operationId: liveLocalGetSession
      tags: [live-local-management]
      security: [{ LiveAdminToken: [], LiveVerifiedTenant: [] }]
      parameters: [{ $ref: "#/components/parameters/LiveSessionId" }]
      responses: { "200": { $ref: "#/components/responses/LiveSessionEnvelope" }, "404": { $ref: "#/components/responses/LiveError" } }

  /tancmark/live/local/v1/sessions/{sessionId}/init:
    post:
      operationId: liveLocalUploadInit
      tags: [live-local-management]
      security: [{ LiveAdminToken: [], LiveVerifiedTenant: [] }]
      summary: Idempotently upload a validated AVC fMP4 initialization segment
      parameters: [{ $ref: "#/components/parameters/LiveSessionId" }, { $ref: "#/components/parameters/LiveIdempotencyKey" }, { $ref: "#/components/parameters/LiveContentSha256" }]
      requestBody: { required: true, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
      responses: { "200": { $ref: "#/components/responses/LiveInitUpload" }, "201": { $ref: "#/components/responses/LiveInitUpload" }, "400": { $ref: "#/components/responses/LiveError" }, "409": { $ref: "#/components/responses/LiveError" }, "413": { $ref: "#/components/responses/LiveError" }, "507": { $ref: "#/components/responses/LiveError" } }

  /tancmark/live/local/v1/sessions/{sessionId}/start:
    post:
      operationId: liveLocalStartSession
      tags: [live-local-management]
      security: [{ LiveAdminToken: [], LiveVerifiedTenant: [] }]
      parameters: [{ $ref: "#/components/parameters/LiveSessionId" }, { $ref: "#/components/parameters/LiveIdempotencyKey" }]
      requestBody: { $ref: "#/components/requestBodies/LiveExpectedRevision" }
      responses: { "200": { $ref: "#/components/responses/LiveStart" }, "409": { $ref: "#/components/responses/LiveError" } }

  /tancmark/live/local/v1/sessions/{sessionId}/segments:
    post:
      operationId: liveLocalAppendSegment
      tags: [live-local-management]
      security: [{ LiveAdminToken: [], LiveVerifiedTenant: [] }]
      summary: Append one validated CMAF fragment; arbitrary bytes are rejected
      parameters:
        - { $ref: "#/components/parameters/LiveSessionId" }
        - { $ref: "#/components/parameters/LiveIdempotencyKey" }
        - { $ref: "#/components/parameters/LiveContentSha256" }
        - { name: x-segment-sequence, in: header, required: true, schema: { type: integer, minimum: 0 } }
        - { name: x-segment-duration-ms, in: header, required: true, description: Cross-checked against parsed track sample durations; the parsed duration is authoritative., schema: { type: integer, minimum: 1, maximum: 60000 } }
      requestBody: { required: true, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
      responses: { "200": { $ref: "#/components/responses/LiveSegmentAppend" }, "201": { $ref: "#/components/responses/LiveSegmentAppend" }, "400": { $ref: "#/components/responses/LiveError" }, "409": { $ref: "#/components/responses/LiveError" }, "413": { $ref: "#/components/responses/LiveError" }, "507": { $ref: "#/components/responses/LiveError" } }

  /tancmark/live/local/v1/sessions/{sessionId}/stop:
    post:
      operationId: liveLocalStopSession
      tags: [live-local-management]
      security: [{ LiveAdminToken: [], LiveVerifiedTenant: [] }]
      summary: Revoke existing grants then idempotently finalize LL-HLS VOD, recording and evidence
      parameters: [{ $ref: "#/components/parameters/LiveSessionId" }, { $ref: "#/components/parameters/LiveIdempotencyKey" }]
      requestBody: { $ref: "#/components/requestBodies/LiveExpectedRevision" }
      responses: { "200": { $ref: "#/components/responses/LiveStop" }, "409": { $ref: "#/components/responses/LiveError" } }

  /tancmark/live/local/v1/sessions/{sessionId}/health:
    get:
      operationId: liveLocalSessionHealth
      tags: [live-local-management]
      security: [{ LiveAdminToken: [], LiveVerifiedTenant: [] }]
      summary: Revalidate initialization, fragments, timelines, hash chains, manifest and recording
      parameters: [{ $ref: "#/components/parameters/LiveSessionId" }]
      responses: { "200": { $ref: "#/components/responses/LiveJson" }, "409": { $ref: "#/components/responses/LiveError" } }

  /tancmark/live/local/v1/sessions/{sessionId}/events:
    get:
      operationId: liveLocalSessionEvents
      tags: [live-local-management]
      security: [{ LiveAdminToken: [], LiveVerifiedTenant: [] }]
      summary: Paginated redacted, tamper-evident event chain
      parameters: [{ $ref: "#/components/parameters/LiveSessionId" }, { $ref: "#/components/parameters/LiveLimit" }, { $ref: "#/components/parameters/LiveCursor" }]
      responses: { "200": { $ref: "#/components/responses/LiveJson" } }

  /tancmark/live/local/v1/sessions/{sessionId}/metrics:
    get:
      operationId: liveLocalSessionMetrics
      tags: [live-local-management]
      security: [{ LiveAdminToken: [], LiveVerifiedTenant: [] }]
      parameters: [{ $ref: "#/components/parameters/LiveSessionId" }]
      responses: { "200": { $ref: "#/components/responses/LiveJson" } }

  /tancmark/live/local/v1/sessions/{sessionId}/evidence:
    get:
      operationId: liveLocalSessionEvidence
      tags: [live-local-management]
      security: [{ LiveAdminToken: [], LiveVerifiedTenant: [] }]
      summary: Support-only transport and storage evidence; all generic authority flags remain false
      parameters: [{ $ref: "#/components/parameters/LiveSessionId" }]
      responses: { "200": { $ref: "#/components/responses/LiveJson" }, "409": { $ref: "#/components/responses/LiveError" } }

  /tancmark/live/local/v1/sessions/{sessionId}/advisory-event:
    get:
      operationId: liveLocalAdvisoryEvent
      tags: [live-local-management]
      security: [{ LiveAdminToken: [], LiveVerifiedTenant: [] }]
      summary: Redacted advisory feed item; autoApply and authority are always false
      parameters: [{ $ref: "#/components/parameters/LiveSessionId" }]
      responses: { "200": { $ref: "#/components/responses/LiveJson" } }

  /tancmark/live/local/v1/sessions/{sessionId}/access-token:
    post:
      operationId: liveLocalIssueAccessToken
      tags: [live-local-management]
      security: [{ LiveAdminToken: [], LiveVerifiedTenant: [] }]
      summary: Issue a single-use signed exchange token for RUNNING or STOPPED playback
      parameters: [{ $ref: "#/components/parameters/LiveSessionId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LiveAccessTokenRequest" } } } }
      responses: { "201": { $ref: "#/components/responses/LiveAccessToken" }, "400": { $ref: "#/components/responses/LiveError" }, "409": { $ref: "#/components/responses/LiveError" } }

  /tancmark/live/local/v1/access/exchange:
    post:
      operationId: liveLocalExchangeAccessToken
      tags: [live-local-playback]
      security: []
      summary: Atomically consume a signed exchange token and set only an HttpOnly, session-specific opaque cookie
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string } }, additionalProperties: false } } } }
      responses:
        "201":
          description: Metadata only; the grant secret is available exclusively in Set-Cookie
          headers: { Set-Cookie: { description: HttpOnly and SameSite=Strict, schema: { type: string } } }
          content: { application/json: { schema: { $ref: "#/components/schemas/LiveExchangeResponse" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/LiveError" }

  /tancmark/live/local/v1/player/{sessionId}:
    get:
      operationId: liveLocalPlayer
      tags: [live-local-playback]
      security: [{ LivePlaybackGrantCookie: [] }]
      summary: Self-contained same-origin MediaSource player with native-HLS fallback and support-only warning
      parameters: [{ $ref: "#/components/parameters/LiveSessionId" }]
      responses: { "200": { description: HTML player, content: { text/html: { schema: { type: string } } } }, "401": { $ref: "#/components/responses/Unauthorized" } }

  /tancmark/live/local/v1/playback/{sessionId}/manifest.m3u8:
    get:
      operationId: liveLocalManifest
      tags: [live-local-playback]
      security: [{ LivePlaybackGrantCookie: [] }]
      summary: Standard LL-HLS while RUNNING and finalized HLS VOD when STOPPED
      description: Emits PART-INF, SERVER-CONTROL and PART URIs. Bounded blocking reload is supported with strict msn/part/skip validation.
      parameters: [{ $ref: "#/components/parameters/LiveSessionId" }, { $ref: "#/components/parameters/LiveIfNoneMatch" }, { $ref: "#/components/parameters/LiveHlsMsn" }, { $ref: "#/components/parameters/LiveHlsPart" }, { $ref: "#/components/parameters/LiveHlsSkip" }]
      responses: { "200": { description: LL-HLS or stopped VOD playlist, content: { application/vnd.apple.mpegurl: { schema: { type: string } } } }, "304": { description: Not modified }, "400": { $ref: "#/components/responses/LiveError" }, "401": { $ref: "#/components/responses/Unauthorized" } }

  /tancmark/live/local/v1/playback/{sessionId}/init.mp4:
    get:
      operationId: liveLocalPlaybackInit
      tags: [live-local-playback]
      security: [{ LivePlaybackGrantCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/LiveSessionId" }, { $ref: "#/components/parameters/LiveIfNoneMatch" }]
      responses: { "200": { description: Validated fMP4 initialization bytes, content: { video/mp4: { schema: { type: string, format: binary } } } }, "304": { description: Not modified }, "401": { $ref: "#/components/responses/Unauthorized" } }

  /tancmark/live/local/v1/playback/{sessionId}/media.json:
    get:
      operationId: liveLocalMediaInventory
      tags: [live-local-playback]
      security: [{ LivePlaybackGrantCookie: [] }]
      summary: Pollable MediaSource fragment inventory with exact RFC codec string
      parameters: [{ $ref: "#/components/parameters/LiveSessionId" }]
      responses: { "200": { $ref: "#/components/responses/LiveMediaInventory" }, "401": { $ref: "#/components/responses/Unauthorized" } }

  /tancmark/live/local/v1/playback/{sessionId}/segments/{segmentId}:
    get:
      operationId: liveLocalPlaybackSegment
      tags: [live-local-playback]
      security: [{ LivePlaybackGrantCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/LiveSessionId" }, { $ref: "#/components/parameters/LiveSegmentId" }, { $ref: "#/components/parameters/LiveIfNoneMatch" }]
      responses: { "200": { description: Validated CMAF fragment, content: { video/iso.segment: { schema: { type: string, format: binary } } } }, "304": { description: Not modified }, "401": { $ref: "#/components/responses/Unauthorized" } }

  /tancmark/live/local/v1/playback/{sessionId}/recording.mp4:
    get:
      operationId: liveLocalRecording
      tags: [live-local-playback]
      security: [{ LivePlaybackGrantCookie: [] }]
      summary: Server-assembled STOPPED VOD recording; requires the dedicated recording scope
      parameters: [{ $ref: "#/components/parameters/LiveSessionId" }, { $ref: "#/components/parameters/LiveIfNoneMatch" }]
      responses: { "200": { description: MP4 recording, content: { video/mp4: { schema: { type: string, format: binary } } } }, "304": { description: Not modified }, "401": { $ref: "#/components/responses/Unauthorized" } }

  /tancmark/live/local/v1/sessions/{sessionId}/grants/{grantId}/revoke:
    post:
      operationId: liveLocalRevokeGrant
      tags: [live-local-management]
      security: [{ LiveAdminToken: [], LiveVerifiedTenant: [] }]
      parameters: [{ $ref: "#/components/parameters/LiveSessionId" }, { name: grantId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { $ref: "#/components/responses/LiveGrantRevoked" }, "404": { $ref: "#/components/responses/LiveError" } }

  /tancmark/live/local/v1/sessions/{sessionId}/revoke:
    post:
      operationId: liveLocalRevokeSessionGrants
      tags: [live-local-management]
      security: [{ LiveAdminToken: [], LiveVerifiedTenant: [] }]
      summary: Increment access revision and token epoch and revoke every existing grant
      parameters: [{ $ref: "#/components/parameters/LiveSessionId" }]
      requestBody: { $ref: "#/components/requestBodies/LiveExpectedRevision" }
      responses: { "200": { $ref: "#/components/responses/LiveSessionRevoked" }, "409": { $ref: "#/components/responses/LiveError" } }

  /tancmark/live/local/v1/sessions/{sessionId}/cleanup/plan:
    post:
      operationId: liveLocalCleanupPlan
      tags: [live-local-management]
      security: [{ LiveAdminToken: [], LiveVerifiedTenant: [] }]
      summary: Idempotent exact managed-media inventory and confirmation digest
      parameters: [{ $ref: "#/components/parameters/LiveSessionId" }, { $ref: "#/components/parameters/LiveIdempotencyKey" }]
      requestBody: { $ref: "#/components/requestBodies/LiveExpectedRevision" }
      responses: { "200": { $ref: "#/components/responses/LiveCleanupPlan" }, "201": { $ref: "#/components/responses/LiveCleanupPlan" }, "409": { $ref: "#/components/responses/LiveError" } }

  /tancmark/live/local/v1/sessions/{sessionId}/cleanup/execute:
    post:
      operationId: liveLocalCleanupExecute
      tags: [live-local-management]
      security: [{ LiveAdminToken: [], LiveVerifiedTenant: [] }]
      summary: Idempotently purge managed media only; metadata, evidence and audit remain
      parameters: [{ $ref: "#/components/parameters/LiveSessionId" }, { $ref: "#/components/parameters/LiveIdempotencyKey" }, { name: If-Match, in: header, required: true, schema: { type: string } }]
      requestBody: { $ref: "#/components/requestBodies/LiveExpectedRevision" }
      responses: { "200": { $ref: "#/components/responses/LiveCleanupExecute" }, "409": { $ref: "#/components/responses/LiveError" } }

  /tancmark/live/local/v1/sessions/{sessionId}/verify-exact-id:
    post:
      operationId: liveLocalVerifyExactId
      tags: [live-local-management]
      security: [{ LiveAdminToken: [], LiveVerifiedTenant: [] }]
      summary: Return the already completed automatic STOPPED-VOD exact verification
      description: No expected ID or ownership authority is accepted from the request body. The server-owned session binding, registry, tenant/account and signature chain are authoritative.
      parameters: [{ $ref: "#/components/parameters/LiveSessionId" }]
      requestBody: { required: false, content: { application/json: { schema: { type: object, additionalProperties: false } } } }
      responses: { "200": { $ref: "#/components/responses/LiveExactIdentity" }, "400": { $ref: "#/components/responses/LiveError" }, "404": { $ref: "#/components/responses/LiveError" }, "409": { $ref: "#/components/responses/LiveError" } }

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /aegis/protect-text:
    post:
      operationId: protectText
      tags: [aegis]
      summary: Apply per-client linguistic shuffling to text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProtectTextRequest"
      responses:
        "200":
          description: Protected text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtectTextResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /aegis/analyze-text:
    post:
      operationId: analyzeText
      tags: [aegis]
      summary: Forensic attribution — match suspect text to a client
      description: Admin-gated. Requires `x-admin-token` header.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeTextRequest"
      responses:
        "200":
          description: Forensic result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeTextResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /aegis/generate-report:
    post:
      operationId: generateReport
      tags: [aegis]
      summary: Generate a forensic PDF report
      description: Admin-gated. Requires `x-admin-token` header. Returns a PDF document.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateReportRequest"
      responses:
        "200":
          description: PDF report
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /forensic-notes:
    get:
      operationId: listForensicNotes
      tags: [audit]
      summary: List recent expert notes
      description: Admin-gated. Requires `x-admin-token` header.
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: Notes
          content:
            application/json:
              schema:
                type: object
                properties:
                  notes:
                    type: array
                    items:
                      $ref: "#/components/schemas/ForensicNote"
                required: [notes]
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createForensicNote
      tags: [audit]
      summary: Persist an expert commentary note
      description: Admin-gated. Requires `x-admin-token` header.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateForensicNoteRequest"
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForensicNote"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /bot-traps:
    get:
      operationId: listBotTraps
      tags: [audit]
      summary: List recently served honeytokens (Bot-Trap Pulse)
      description: Admin-gated. Requires `x-admin-token` header.
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500 }
        - in: query
          name: onlyUsed
          schema: { type: boolean }
      responses:
        "200":
          description: Recent honeytoken servings
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/BotTrapEvent"
                  stats:
                    $ref: "#/components/schemas/BotTrapStats"
                required: [events, stats]
        "401":
          $ref: "#/components/responses/Unauthorized"

  /audit:
    get:
      operationId: listAudit
      tags: [audit]
      summary: List recent audit events
      description: Admin-gated. Requires `x-admin-token` header.
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - in: query
          name: kind
          schema:
            $ref: "#/components/schemas/AuditKind"
        - in: query
          name: userId
          schema: { type: string }
        - in: query
          name: ip
          schema: { type: string }
        - in: query
          name: clientId
          schema: { type: integer }
        - in: query
          name: sinceMs
          schema: { type: integer }
      responses:
        "200":
          description: Events + stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /audit/stats:
    get:
      operationId: auditStats
      tags: [audit]
      summary: Aggregate counts of audit events by kind
      description: Admin-gated. Requires `x-admin-token` header.
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditStats"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ---------------------------------------------------------------------------
  # Visual Lab (admin-gated) — geliştirme test arenası.
  # Runtime endpoint'leri burada sözleşme amaçlı belgelenmiştir; algoritma,
  # eşik, verdict veya skor mantığı bu spec ile değiştirilmez.
  # ---------------------------------------------------------------------------
  /aegis/visual-lab/jobs:
    post:
      operationId: visualLabCreateJob
      tags: [visualLab]
      summary: Görsel üzerinde 8 saldırı senaryosunu sırayla koşan iş başlatır
      description: |
        Admin-gated. `x-admin-token` zorunlu. Multipart form `photo` alanıyla
        JPEG/PNG/WebP yüklenir. Yanıt 202 + jobId döner; ilerleme
        `GET /aegis/visual-lab/jobs/{id}` ile takip edilir.

        Ekran fotoğrafı tespit edilirse (substrate.isScreenshot=true) senaryo
        bütçesi `timeoutPerScenarioSec` yerine `screenshotTimeoutPerScenarioSec`
        olarak uygulanır.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  description: Binary file content (multipart upload — JPEG/PNG/WebP)
              required: [image]
      responses:
        "202":
          description: İş kuyruğa alındı
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisualLabJobCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "400":
          $ref: "#/components/responses/BadRequest"
  /aegis/visual-lab/jobs/{id}:
