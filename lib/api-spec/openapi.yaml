      type: object
      description: AEGIS iki seviyeli karar projeksiyonu (v0.7.1/v0.7.2). ADDITIVE, opsiyonel. Ana karar mantigi (found / VAULT / verdict / visualVaultConfirmed / aggregatedVault) bu alandan ETKILENMEZ. T6_CANDIDATE/T6_VAULT ana VAULT yerine gecmez; yalniz candidateConfidence.contributors.recoveryHints katkisi verir.
