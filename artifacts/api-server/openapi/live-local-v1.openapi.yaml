openapi: 3.1.0
info:
  title: TancMark Live Local Product Core
  version: 1.0.0-local
  description: NON-AUTHORITATIVE REVIEW COPY. The authoritative contract is lib/api-spec/openapi.yaml. Single-node, local segment-push Live core; transport evidence never grants authority.
x-tancmark-contract-authority: NON_AUTHORITATIVE_REVIEW_COPY
x-tancmark-authoritative-source: lib/api-spec/openapi.yaml
servers:
  - url: /api/tancmark/live/local/v1
security:
  - AdminToken: []
    VerifiedTenant: []
tags:
  - name: management
  - name: playback
paths:
  /management-console:
    get: { operationId: liveLocalManagementConsole, security: [], tags: [management], summary: No-data shell that submits admin and tenant headers in memory only, responses: { "200": { description: HTML management shell, content: { text/html: { schema: { type: string } } } } } }
  /status:
    get: { operationId: liveLocalStatus, tags: [management], summary: Storage, lease, keyring and local-gate status, responses: { "200": { $ref: "#/components/responses/Json" }, "401": { $ref: "#/components/responses/Error" }, "503": { $ref: "#/components/responses/Error" } } }
  /debt:
    get: { operationId: liveLocalDebt, tags: [management], summary: Explicit external/provider debt, responses: { "200": { $ref: "#/components/responses/Json" } } }
  /console:
    get: { operationId: liveLocalAuthenticatedConsole, tags: [management], summary: Authenticated compatibility redirect to the no-data management shell, responses: { "303": { description: Same-origin redirect with no credential forwarding } } }
  /sessions:
    get:
      operationId: liveLocalListSessions
      tags: [management]
      summary: Paginated tenant sessions
      parameters: [ { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Cursor" } ]
      responses: { "200": { $ref: "#/components/responses/Json" } }
    post:
      operationId: liveLocalCreateSession
      tags: [management]
      summary: Create a server-owned protected session by default
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { legalHold: { type: boolean }, protectionMode: { type: string, enum: [PROTECTED_TANCMARK, TRANSPORT_ONLY], default: PROTECTED_TANCMARK } }, additionalProperties: false }, examples: { default: { value: { legalHold: false, protectionMode: PROTECTED_TANCMARK } } } } } }
      responses: { "201": { $ref: "#/components/responses/Json" }, "400": { $ref: "#/components/responses/Error" } }
  /sessions/{sessionId}:
    get: { operationId: liveLocalGetSession, tags: [management], summary: Get one tenant-bound session, parameters: [ { $ref: "#/components/parameters/SessionId" } ], responses: { "200": { $ref: "#/components/responses/Json" }, "404": { $ref: "#/components/responses/Error" } } }
  /sessions/{sessionId}/init:
    post:
      operationId: liveLocalUploadInit
      tags: [management]
      summary: Idempotently upload validated AVC fMP4 init
      parameters: [ { $ref: "#/components/parameters/SessionId" }, { $ref: "#/components/parameters/IdempotencyKey" }, { $ref: "#/components/parameters/ContentSha256" } ]
      requestBody: { required: true, content: { application/octet-stream: { schema: { type: string, contentEncoding: base64 } } } }
      responses: { "201": { $ref: "#/components/responses/Json" }, "400": { $ref: "#/components/responses/Error" }, "409": { $ref: "#/components/responses/Error" }, "507": { $ref: "#/components/responses/Error" } }
  /sessions/{sessionId}/start:
    post: { operationId: liveLocalStartSession, tags: [management], summary: Idempotently start READY session, parameters: [ { $ref: "#/components/parameters/SessionId" }, { $ref: "#/components/parameters/IdempotencyKey" } ], requestBody: { $ref: "#/components/requestBodies/ExpectedRevision" }, responses: { "200": { $ref: "#/components/responses/Json" }, "409": { $ref: "#/components/responses/Error" } } }
  /sessions/{sessionId}/segments:
    post:
      operationId: liveLocalAppendSegment
      tags: [management]
      summary: Append one validated CMAF fragment
      parameters: [ { $ref: "#/components/parameters/SessionId" }, { $ref: "#/components/parameters/IdempotencyKey" }, { $ref: "#/components/parameters/ContentSha256" }, { name: x-segment-sequence, in: header, required: true, schema: { type: integer, minimum: 0 } }, { name: x-segment-duration-ms, in: header, required: true, schema: { type: integer, minimum: 100, maximum: 60000 } } ]
      requestBody: { required: true, content: { application/octet-stream: { schema: { type: string, contentEncoding: base64 } } } }
      responses: { "201": { $ref: "#/components/responses/Json" }, "400": { $ref: "#/components/responses/Error" }, "409": { $ref: "#/components/responses/Error" }, "413": { $ref: "#/components/responses/Error" }, "507": { $ref: "#/components/responses/Error" } }
  /sessions/{sessionId}/stop:
    post: { operationId: liveLocalStopSession, tags: [management], summary: Revoke grants then deterministically finalize manifest, recording and evidence, parameters: [ { $ref: "#/components/parameters/SessionId" }, { $ref: "#/components/parameters/IdempotencyKey" } ], requestBody: { $ref: "#/components/requestBodies/ExpectedRevision" }, responses: { "200": { $ref: "#/components/responses/Json" }, "409": { $ref: "#/components/responses/Error" } } }
  /sessions/{sessionId}/health:
    get: { operationId: liveLocalSessionHealth, tags: [management], summary: Revalidate init, fragments, hash chains, manifest and recording, parameters: [ { $ref: "#/components/parameters/SessionId" } ], responses: { "200": { $ref: "#/components/responses/Json" } } }
  /sessions/{sessionId}/events:
    get: { operationId: liveLocalSessionEvents, tags: [management], summary: Paginated tamper-evident event chain, parameters: [ { $ref: "#/components/parameters/SessionId" }, { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Cursor" } ], responses: { "200": { $ref: "#/components/responses/Json" } } }
  /sessions/{sessionId}/metrics:
    get: { operationId: liveLocalSessionMetrics, tags: [management], summary: Redacted local session metrics, parameters: [ { $ref: "#/components/parameters/SessionId" } ], responses: { "200": { $ref: "#/components/responses/Json" } } }
  /sessions/{sessionId}/evidence:
    get: { operationId: liveLocalSessionEvidence, tags: [management], summary: Support-only transport/storage evidence, parameters: [ { $ref: "#/components/parameters/SessionId" } ], responses: { "200": { $ref: "#/components/responses/Json" }, "409": { $ref: "#/components/responses/Error" } } }
  /sessions/{sessionId}/advisory-event:
    get: { operationId: liveLocalAdvisoryEvent, tags: [management], summary: Redacted non-auto-applying advisory event, parameters: [ { $ref: "#/components/parameters/SessionId" } ], responses: { "200": { $ref: "#/components/responses/Json" } } }
  /sessions/{sessionId}/access-token:
    post:
      operationId: liveLocalIssueAccessToken
      tags: [management]
      summary: Issue single-use signed exchange token for RUNNING or STOPPED playback
      parameters: [ { $ref: "#/components/parameters/SessionId" } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [viewerSubject], properties: { viewerSubject: { type: string }, ttlSeconds: { type: integer, minimum: 1, maximum: 300 }, resourceScopes: { type: array, uniqueItems: true, items: { enum: [init, manifest, media-json, player, recording, segment] } } }, additionalProperties: false } } } }
      responses: { "201": { $ref: "#/components/responses/Json" }, "409": { $ref: "#/components/responses/Error" } }
  /access/exchange:
    post:
      operationId: liveLocalExchangeAccessToken
      security: []
      tags: [playback]
      summary: Atomically consume exchange token and set only an HttpOnly session-specific opaque grant cookie
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string } }, additionalProperties: false } } } }
      responses: { "201": { description: Grant metadata without token; Set-Cookie contains the only opaque grant, headers: { Set-Cookie: { schema: { type: string }, description: HttpOnly; SameSite=Strict } }, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }, "401": { $ref: "#/components/responses/Error" }, "409": { $ref: "#/components/responses/Error" } }
  /player/{sessionId}:
    get: { operationId: liveLocalPlayer, security: [ { PlaybackGrantCookie: [] } ], tags: [playback], summary: Self-contained same-origin MediaSource player with native-HLS fallback, parameters: [ { $ref: "#/components/parameters/SessionId" } ], responses: { "200": { description: HTML player, content: { text/html: { schema: { type: string } } } }, "401": { $ref: "#/components/responses/Error" } } }
  /playback/{sessionId}/manifest.m3u8:
    get: { operationId: liveLocalManifest, security: [ { PlaybackGrantCookie: [] } ], tags: [playback], summary: RUNNING LL-HLS or STOPPED HLS VOD with bounded blocking reload, parameters: [ { $ref: "#/components/parameters/SessionId" }, { $ref: "#/components/parameters/IfNoneMatch" }, { $ref: "#/components/parameters/HlsMsn" }, { $ref: "#/components/parameters/HlsPart" }, { $ref: "#/components/parameters/HlsSkip" } ], responses: { "200": { description: PART-INF, SERVER-CONTROL and PART URI playlist, content: { application/vnd.apple.mpegurl: { schema: { type: string } } } }, "304": { description: Not modified }, "400": { $ref: "#/components/responses/Error" }, "401": { $ref: "#/components/responses/Error" } } }
  /playback/{sessionId}/init.mp4:
    get: { operationId: liveLocalPlaybackInit, security: [ { PlaybackGrantCookie: [] } ], tags: [playback], summary: Validated init segment, parameters: [ { $ref: "#/components/parameters/SessionId" }, { $ref: "#/components/parameters/IfNoneMatch" } ], responses: { "200": { description: fMP4 init, content: { video/mp4: {} } }, "304": { description: Not modified } } }
  /playback/{sessionId}/media.json:
    get: { operationId: liveLocalMediaInventory, security: [ { PlaybackGrantCookie: [] } ], tags: [playback], summary: Pollable MediaSource fragment inventory with RFC codec string, parameters: [ { $ref: "#/components/parameters/SessionId" } ], responses: { "200": { $ref: "#/components/responses/Json" } } }
  /playback/{sessionId}/segments/{segmentId}:
    get: { operationId: liveLocalPlaybackSegment, security: [ { PlaybackGrantCookie: [] } ], tags: [playback], summary: Validated CMAF fragment, parameters: [ { $ref: "#/components/parameters/SessionId" }, { name: segmentId, in: path, required: true, schema: { type: string, format: uuid } }, { $ref: "#/components/parameters/IfNoneMatch" } ], responses: { "200": { description: CMAF fragment, content: { video/iso.segment: {} } }, "304": { description: Not modified }, "401": { $ref: "#/components/responses/Error" } } }
  /playback/{sessionId}/recording.mp4:
    get: { operationId: liveLocalRecording, security: [ { PlaybackGrantCookie: [] } ], tags: [playback], summary: Server-assembled STOPPED VOD requiring dedicated recording scope, parameters: [ { $ref: "#/components/parameters/SessionId" }, { $ref: "#/components/parameters/IfNoneMatch" } ], responses: { "200": { description: MP4 recording, content: { video/mp4: {} } }, "304": { description: Not modified } } }
  /sessions/{sessionId}/grants/{grantId}/revoke:
    post: { operationId: liveLocalRevokeGrant, tags: [management], summary: Revoke one opaque grant, parameters: [ { $ref: "#/components/parameters/SessionId" }, { name: grantId, in: path, required: true, schema: { type: string, format: uuid } } ], responses: { "200": { $ref: "#/components/responses/Json" }, "404": { $ref: "#/components/responses/Error" } } }
  /sessions/{sessionId}/revoke:
    post: { operationId: liveLocalRevokeSessionGrants, tags: [management], summary: Increment access revision and epoch; revoke all grants, parameters: [ { $ref: "#/components/parameters/SessionId" } ], requestBody: { $ref: "#/components/requestBodies/ExpectedRevision" }, responses: { "200": { $ref: "#/components/responses/Json" } } }
  /sessions/{sessionId}/cleanup/plan:
    post: { operationId: liveLocalCleanupPlan, tags: [management], summary: Idempotent retention inventory and confirmation digest, parameters: [ { $ref: "#/components/parameters/SessionId" }, { $ref: "#/components/parameters/IdempotencyKey" } ], requestBody: { $ref: "#/components/requestBodies/ExpectedRevision" }, responses: { "201": { $ref: "#/components/responses/Json" }, "409": { $ref: "#/components/responses/Error" } } }
  /sessions/{sessionId}/cleanup/execute:
    post: { operationId: liveLocalCleanupExecute, tags: [management], summary: Idempotent managed-media-only purge; metadata/evidence/audit retained, parameters: [ { $ref: "#/components/parameters/SessionId" }, { $ref: "#/components/parameters/IdempotencyKey" }, { name: If-Match, in: header, required: true, schema: { type: string } } ], requestBody: { $ref: "#/components/requestBodies/ExpectedRevision" }, responses: { "200": { $ref: "#/components/responses/Json" }, "409": { $ref: "#/components/responses/Error" } } }
  /sessions/{sessionId}/verify-exact-id:
    post: { operationId: liveLocalVerifyExactId, tags: [management], summary: Return the automatic STOPPED-VOD exact verification; no client ID authority accepted, parameters: [ { $ref: "#/components/parameters/SessionId" } ], requestBody: { required: false, content: { application/json: { schema: { type: object, additionalProperties: false } } } }, responses: { "200": { $ref: "#/components/responses/Json" }, "404": { $ref: "#/components/responses/Error" }, "409": { $ref: "#/components/responses/Error" } } }
components:
  securitySchemes:
    AdminToken: { type: apiKey, in: header, name: x-admin-token }
    VerifiedTenant: { type: apiKey, in: header, name: x-tancmark-live-tenant-id, description: Exact single-tenant fallback; verified apiClient.id remains primary authority. }
    PlaybackGrantCookie: { type: apiKey, in: cookie, name: tmlg_session_hash, description: Actual cookie name is deterministically session-specific. }
  parameters:
    SessionId: { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
    IdempotencyKey: { name: x-idempotency-key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 200 } }
    ContentSha256: { name: x-content-sha256, in: header, required: true, schema: { type: string, pattern: "^[0-9a-f]{64}$" } }
    IfNoneMatch: { name: If-None-Match, in: header, required: false, schema: { type: string } }
    Limit: { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
    Cursor: { name: cursor, in: query, required: false, schema: { type: integer, minimum: 0 } }
    HlsMsn: { name: _HLS_msn, in: query, required: false, schema: { type: integer, minimum: 0, maximum: 9999999999 }, description: Bounded blocking-reload media sequence. }
    HlsPart: { name: _HLS_part, in: query, required: false, schema: { type: integer, enum: [0] }, description: Requires _HLS_msn; one part per fragment. }
    HlsSkip: { name: _HLS_skip, in: query, required: false, schema: { type: string, enum: [YES, v2] } }
  requestBodies:
    ExpectedRevision: { required: true, content: { application/json: { schema: { type: object, required: [expectedRevision], properties: { expectedRevision: { type: integer, minimum: 0 } }, additionalProperties: false } } } }
  schemas:
    JsonObject: { type: object, additionalProperties: true }
    Error: { type: object, required: [error], properties: { error: { type: string, example: live_session_revision_conflict } }, additionalProperties: false }
  responses:
    Json: { description: JSON response, content: { application/json: { schema: { $ref: "#/components/schemas/JsonObject" } } } }
    Error: { description: Fail-closed error; 401 for missing/invalid principal or grant, 404 for tenant isolation, 409 for state/replay/integrity conflicts, 507 for quota/free-space gates., content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
